name: CI

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # preparamos maquina ubuntu
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: PYTHONPATH=. uv run pytest