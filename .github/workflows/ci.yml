name: CI

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Las pruebas importan los modelos SQLAlchemy, pero no abren conexiones.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/factoria_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: PYTHONPATH=. uv run pytest -q

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.17.3

      # --exit-zero: muestra los avisos sin bloquear el PR (hay deuda heredada)
      - name: Run ruff
        run: |
          ruff check --exit-zero --output-format=concise .
          ruff check --exit-zero --statistics .
