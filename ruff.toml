# Configuración de Ruff (linter). La usa el job `lint` del CI.
# Para actualizar Ruff, cambiar la versión aquí y en .github/workflows/ci.yml.
required-version = "==0.17.3"
target-version = "py312"

# Migraciones autogeneradas por Alembic.
extend-exclude = ["alembic/versions"]

[lint]
# E4/E7/E9/F: errores reales, I: orden de imports, B: bugs típicos, UP: sintaxis moderna
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.flake8-bugbear]
# Uso idiomático de FastAPI en los parámetros de las rutas, no es un bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[lint.per-file-ignores]
# Alembic necesita importar los modelos para registrarlos en Base.metadata.
"alembic/env.py" = ["F401"]
